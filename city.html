<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="robots" content="noindex">
<title>City Ladder · Table Wars</title>
<!-- G3 THE CITY LADDER (Austin 2026-11-10, the seven-features page feature 6): city.html lists the cities with 3 or more
     Table Wars venues; city.html?c=<city key> is that city's ladder this month (LAST MONTH one tap away): each venue's
     online wins against the other venues of the city, the losses beside them (the tie rule: fewer losses, then who
     got there first). ?v=<venue> lights that venue's row. Plain static files; the page asks tw_lad_phone with the
     public anon key (config.js). -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  #ladder .row b, #cities .row b { white-space:normal; overflow-wrap:anywhere; line-height:1.05; }
  #ladder .row .pl { font:800 26px/1 var(--mono); color:var(--brass); min-width:34px; text-align:center; }
  #ladder .row { grid-template-columns:auto minmax(0, 1fr) auto; }
  #ladder .months { display:flex; gap:8px; justify-content:center; padding:10px 12px 8px; }
  #ladder .months .tlink { font:600 18px/1 var(--label); letter-spacing:.06em; color:var(--gold); background:#14110a; border:0; border-radius:6px; padding:8px 12px 5px; cursor:pointer; }
  #ladder .months + .row { border-top:1px solid var(--line); }
  #ladder .row .w { font:700 22px/1 var(--mono); color:var(--gold); white-space:nowrap; }
</style>
</head>
<body>
<main id="app" class="pg"><div class="bug"><b><i>TABLE WARS</i></b><span><i>CITY LADDER</i></span></div></main>
<script src="config.js"></script>
<script src="landing.js"></script>
<script src="city.js"></script>
</body>
</html>
