<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Wars: Link Expired</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { --bg:#f4f1ea; --card:#fffdf8; --ink:#1b2130; --dim:#5a6377; --line:#d8d0c0; --body:"Inter", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--ink); font:400 18px/1.45 var(--body); }
main { max-width:460px; margin:0 auto; padding:32px 16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
h1 { font:800 28px/1.15 var(--body); margin-bottom:8px; }
p { color:var(--dim); }
</style>
</head>
<body><main><section><h1>This link has expired.</h1><p>Sign-up links only work for a few minutes. Ask Table Wars for a new link, then open it right away.</p></section></main></body>
</html>
